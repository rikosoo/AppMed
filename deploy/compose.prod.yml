name: financemed
services:
  api:
    environment:
      DATABASE_PATH: /data/financemed.sqlite3
      SESSION_COOKIE_SECURE: "true"
      APP_ALLOWED_ORIGINS: ${APP_ORIGIN:?Defina APP_ORIGIN com https em deploy/.env}
    volumes:
      - api_data:/data
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN em deploy/.env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Defina BASIC_AUTH_USER em deploy/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Defina BASIC_AUTH_HASH em deploy/.env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  api_data:
  caddy_data:
  caddy_config:
