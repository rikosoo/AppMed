name: Mobile test builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma para compilar (sem publicação nas lojas)
        type: choice
        options: [android, ios, both]
        default: android
permissions:
  contents: read
env:
  FINANCEMED_API_ORIGIN: ${{ vars.FINANCEMED_API_ORIGIN || 'https://app.75hard.club' }}
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceMed-Android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -version
      - name: Build for iOS Simulator (no signing)
        run: >-
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --keepParent build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app build/FinanceMed-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceMed-iOS-simulator
          path: build/FinanceMed-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 7
